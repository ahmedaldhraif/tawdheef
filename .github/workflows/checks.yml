name: Check contributions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/marketing/build-directory-pack.mjs --check
      - run: npm run release:check
      - run: npm run build
      - run: node website/build.mjs
      - run: node scripts/marketing/check-seo.mjs
