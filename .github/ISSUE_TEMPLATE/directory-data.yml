name: Directory data
description: Fix an existing record or add missing details, in any country
title: "[Directory] "
body:
  - type: markdown
    attributes:
      value: "No coding needed. Use this to correct or enrich an existing entry in any country. For a missing organisation, choose Add a company. Issues are public: do not include CVs, private contacts, tracking, passwords or account data. See SECURITY.md for sensitive concerns."
  - type: input
    id: country
    attributes:
      label: Country or directory
      placeholder: "Country name, and the pack name if it already exists"
    validations:
      required: true
  - type: input
    id: organisation
    attributes:
      label: Organisation and existing record ID or public record link
      description: Copy the record ID from the pack index if you can. If you cannot find it, the organisation name and public URL are enough for review.
      placeholder: "Organisation name; record ID if known"
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: What needs changing?
      options:
        - Correct a link or contact route
        - Add missing public details
        - Correct a name, source role or other detail
        - Report a duplicate or an unavailable route
        - Request removal of public directory information
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Proposed change
      description: Say what is currently shown and what should replace it. Distinguish an employer from an agency, portal or programme. Say when something is unknown.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public source links
      description: Link to pages supporting the change, preferably the organisation's own site. Include the actual careers/contact destination. Do not guess an email, ownership or eligibility. Do not repost sensitive material to request its removal.
      placeholder: "Source URL:\nWhat it confirms:"
    validations:
      required: true
  - type: input
    id: checked-date
    attributes:
      label: Date checked
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: checkboxes
    id: public-data
    attributes:
      label: Public data only
      options:
        - label: This report contains public directory information, not private applicant or account data.
          required: true
