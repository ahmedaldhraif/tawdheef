<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Tawdheef loading mark" ><title>Tawdheef loading mark</title><style>.dot{transform-box:fill-box;transform-origin:center}
.dot-a{animation:tawdheef-dot 1120ms cubic-bezier(.45,0,.55,1) infinite}
.dot-b{animation:tawdheef-dot 1120ms cubic-bezier(.45,0,.55,1) 140ms infinite}
@keyframes tawdheef-dot{0%,70%,100%{opacity:1;transform:translateY(0)}35%{opacity:.48;transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.dot-a,.dot-b{animation:none}}
</style><g fill="#5A2AFF"><path d="M10 40.4H26V59.6H74V40.4H90V75.6H10Z"/><rect class="dot dot-a" x="31.333333" y="24.4" width="16" height="16"/><rect class="dot dot-b" x="52.666667" y="24.4" width="16" height="16"/></g></svg>
