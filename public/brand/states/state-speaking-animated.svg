<svg xmlns="http://www.w3.org/2000/svg" class="tawdheef-mascot" data-option="wink" data-state="speaking" data-phase="speaking" data-busy="true" data-playing="true" viewBox="0 0 100 100" width="400" height="400" role="img" aria-label="ت · Speaking…" style="color:#5A2AFF" fill="currentColor"><title>ت · Speaking…</title><style>/* Regular logo = two dots. Main agent = square + one wide >. */
.tawdheef-mascot{display:block;overflow:visible;fill:currentColor;color:#5a2aff}
.tawdheef-mascot .mascot-pose{transform-box:view-box;transform-origin:50px 75.6px}
.tawdheef-mascot .mascot-face{transform-box:view-box;transform-origin:50px 28.4px}
.tawdheef-mascot .mascot-eye{transform-box:fill-box;transform-origin:center}
.tawdheef-mascot .mascot-eye-angle{opacity:0}
.tawdheef-mascot:not([data-state="idle"]):not([data-state="rest"]) .mascot-eye-code>.mascot-eye-rest{opacity:0}
.tawdheef-mascot:not([data-state="idle"]):not([data-state="rest"]) .mascot-eye-code>.mascot-eye-angle{opacity:1}
.tawdheef-mascot[data-option="original"] .mascot-eye-code>.mascot-eye-rest{opacity:1!important}
.tawdheef-mascot[data-option="original"] .mascot-eye-code>.mascot-eye-angle{opacity:0!important;display:none}
.tawdheef-mascot[data-option="original"] *{animation:none!important}
.tawdheef-mascot[data-state="hello"] .mascot-pose{transform:rotate(-4deg)}
.tawdheef-mascot[data-state="thinking"] .mascot-pose{transform:rotate(3deg)}
.tawdheef-mascot[data-state="thinking"] .mascot-face{transform:translate(2px,-1px)}
.tawdheef-mascot[data-state="happy"] .mascot-eye-square{transform:scaleY(.8)}
.tawdheef-mascot[data-state="attention"] .mascot-eye-square{transform:translateY(-1.5px)}
.tawdheef-mascot[data-playing="true"][data-state="hello"] .mascot-pose{animation:mascot-hello 2800ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="hello"] .mascot-eye-square{animation:mascot-blink 2800ms cubic-bezier(.23,1,.32,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="thinking"] .mascot-face{animation:mascot-look 3200ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="working"] .mascot-eye-angle-right{animation:mascot-work 1800ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="coding"] .mascot-eye-angle-right{animation:mascot-code-right 2000ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="happy"] .mascot-pose{animation:mascot-hop 2400ms cubic-bezier(.23,1,.32,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="attention"] .mascot-face{animation:mascot-attention 2200ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot .mascot-sheen{opacity:0;pointer-events:none}
.tawdheef-mascot[data-playing="true"][data-busy="true"]:not([data-option="original"]) .mascot-sheen{opacity:.8}
.tawdheef-mascot[data-playing="true"][data-busy="true"]:not([data-option="original"]) .mascot-shimmer{animation:mascot-shimmer 1400ms linear -.35s infinite}
.tawdheef-mascot[data-playing="true"]:is([data-state="loading"],[data-state="connecting"]) .mascot-face{animation:mascot-connect 1800ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="reading"] .mascot-face{animation:mascot-read 2400ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="searching"] .mascot-face{animation:mascot-search 2200ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="writing"] .mascot-eye-square{animation:mascot-write 1000ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="rewriting"] .mascot-face{animation:mascot-read 1900ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="generating"] .mascot-pose{animation:mascot-generate 2400ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="retrying"] .mascot-pose{animation:mascot-retry 1800ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"]:is([data-state="background"],[data-state="waiting"]) .mascot-pose{animation:mascot-wait 4000ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="listening"] .mascot-eye-square{animation:mascot-listen 1800ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="speaking"] .mascot-pose{animation:mascot-speak 900ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-playing="true"][data-state="speaking"] .mascot-eye-square{animation:mascot-write 700ms cubic-bezier(.77,0,.175,1) infinite}
.tawdheef-mascot[data-paused="true"] *{animation-play-state:paused!important}
@keyframes mascot-hello{0%,12%,72%,100%{transform:rotate(0)}28%,38%{transform:rotate(-5deg)}48%{transform:rotate(2deg)}60%{transform:rotate(-1deg)}}
@keyframes mascot-blink{0%,36%,46%,100%{transform:scaleY(1)}40%,42%{transform:scaleY(.2)}}
@keyframes mascot-look{0%,5%,88%,100%{transform:translate(0,0)}24%,42%{transform:translate(3px,-2px)}62%,72%{transform:translate(-2px,-1px)}}
@keyframes mascot-work{0%,20%,80%,100%{transform:translateX(0)}40%,60%{transform:translateX(1.2px)}}
@keyframes mascot-code-right{0%,20%,80%,100%{transform:translateX(0)}40%,60%{transform:translateX(.8px)}}
@keyframes mascot-hop{0%,15%,62%,100%{transform:translateY(0)}25%{transform:translateY(1px)}38%{transform:translateY(-4px)}52%{transform:translateY(.6px)}}
@keyframes mascot-rest{0%,100%{transform:translateY(0)}50%{transform:translateY(.65px)}}
@keyframes mascot-attention{0%,20%,80%,100%{transform:translateY(0)}40%,60%{transform:translateY(-.7px)}}
@keyframes mascot-shimmer{from{transform:translateX(0)}to{transform:translateX(200px)}}
@keyframes mascot-connect{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(-2px)}}
@keyframes mascot-read{0%,100%{transform:translate(0,0)}20%{transform:translate(-2.5px,.5px)}60%{transform:translate(2.5px,.5px)}80%{transform:translate(0,1px)}}
@keyframes mascot-search{0%,100%{transform:translateX(0)}20%,35%{transform:translateX(-3px)}60%,75%{transform:translateX(3px)}}
@keyframes mascot-write{0%,100%{transform:translateY(0) scaleY(1)}30%{transform:translateY(1px) scaleY(.8)}60%{transform:translateY(-1.8px) scaleY(1)}}
@keyframes mascot-generate{0%,100%{transform:scale(1)}45%{transform:scale(1.025)}}
@keyframes mascot-retry{0%,100%{transform:rotate(0)}24%{transform:rotate(-2deg)}55%{transform:rotate(1deg)}}
@keyframes mascot-wait{0%,100%{opacity:.78}45%{opacity:1}}
@keyframes mascot-listen{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.82)}}
@keyframes mascot-speak{0%,100%{transform:translateY(0)}28%{transform:translateY(calc(-1.6px * var(--speech-intensity,1)))}64%{transform:translateY(calc(-.5px * var(--speech-intensity,1)))}}
@media(prefers-reduced-motion:reduce),(forced-colors:active){.tawdheef-mascot *{animation:none!important}}
@media(prefers-reduced-motion:reduce),(forced-colors:active){.tawdheef-mascot .mascot-sheen{opacity:0!important}}
@media(forced-colors:active){.tawdheef-mascot{color:CanvasText!important}}
</style><defs><clipPath id="tawdheef-wink-speaking-clip"><path d="M10 40.4H26V59.6H74V40.4H90V75.6H10Z"/></clipPath><linearGradient id="tawdheef-wink-speaking-shine"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".8"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient></defs><g class="mascot-pose"><path class="mascot-body" d="M10 40.4H26V59.6H74V40.4H90V75.6H10Z"/><g class="mascot-face"><g class="mascot-eye mascot-eye-square"><g class="mascot-eye-rest"><rect x="28.333333" y="20.4" width="16" height="16" rx="0"/></g></g><g class="mascot-eye mascot-eye-code"><g class="mascot-eye-rest"><rect x="55.666667" y="20.4" width="16" height="16" rx="0"/></g><g class="mascot-eye-angle mascot-eye-angle-right" opacity="0"><path d="M53.666667 20.4L73.66666699999999 25.4V31.4L53.666667 36.4V30.4L65.66666699999999 28.4L53.666667 26.4Z"/></g></g></g><g class="mascot-sheen" clip-path="url(#tawdheef-wink-speaking-clip)"><rect class="mascot-shimmer" x="-65" y="12" width="60" height="80" fill="url(#tawdheef-wink-speaking-shine)"/></g></g></svg>
