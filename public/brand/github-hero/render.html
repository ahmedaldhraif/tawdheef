<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native GitHub hero export</title>
<style>body{font:15px system-ui;background:#111110;color:#eee;max-width:900px;margin:40px auto;padding:20px}button,a{font:inherit;padding:12px;display:inline-block;color:inherit}canvas,img{max-width:100%;height:auto}#downloads a{margin:8px;border:1px solid #444;border-radius:8px}button{cursor:pointer}#status{min-height:24px}</style>
<h1>Native GitHub hero export</h1><p>Original Coding and Speaking artwork, the website's smooth pose handoff, solid joined brand lettering.</p>
<button id="build">Build native hero</button><button id="save" disabled>Save to repository</button><p id="status" role="status">Ready</p><canvas id="preview" width="800" height="176"></canvas><div id="downloads"></div>
<script type="module">
import {paintTimeline,clearTimelineCache} from '../studio/timeline.mjs';
import {GIFEncoder,quantize,applyPalette} from '../studio/vendor/gifenc.mjs';
const W=800,H=176,FPS=24,S=2,words=['tawdheef.com','توظيف.كوم'];
const status=document.querySelector('#status'),preview=document.querySelector('#preview'),links=document.querySelector('#downloads');
const outputs=new Map(),save=document.querySelector('#save');
save.onclick=async()=>{save.disabled=true;try{if(outputs.size!==4)throw new Error('Build all four assets first.');for(const[name,bytes]of outputs){const response=await fetch('/__hero-export/'+name,{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Native-Hero':'save'},body:bytes});if(!response.ok)throw new Error('Start the local exporter with --save. HTTP '+response.status);}status.textContent='Saved all four complete hero assets to the repository.';}catch(error){status.textContent=error.message;}finally{save.disabled=false;}};
const nativeSVG=new Map();
const getSVG=async state=>{if(!nativeSVG.has(state))nativeSVG.set(state,await(await fetch('../states/state-'+state+'-animated.svg')).text());return nativeSVG.get(state);};
function dataLink(bytes,name,type){outputs.set(name,bytes);const a=document.createElement('a');a.download=name;a.textContent='Download '+name;const chunk=32768;let binary='';for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));a.href='data:'+type+';base64,'+btoa(binary);links.append(a);}
function timeline(){let total=0;const parts=[];for(let index=0;index<2;index++){for(const [phase,duration]of[['type',words[index].length*65],['hold',2100],['erase',words[index].length*30],['gap',320]]){parts.push({index,phase,start:total,duration});total+=duration;}}return{parts,total};}
function motionAt(time,parts,total){
 const holds=parts.filter(p=>p.phase==='hold');
 // Coding continues through erase, the empty interval and the next word.
 // The negative start also preserves its phase across the GIF loop seam.
 const points=[{start:holds[1].start+holds[1].duration-total,state:'coding'},...holds.flatMap(p=>[{start:p.start,state:'speaking'},{start:p.start+p.duration,state:'coding'}])];
 const active=points.filter(p=>p.start<=time).at(-1),index=points.indexOf(active),prior=points[index-1];
 return {state:active.state,local:time-active.start,bridge:{fromState:prior?.state||'speaking',fromTimeMs:prior?active.start-prior.start:2100,elapsedMs:time-active.start}};
}
const imageFrom=async(svg,ink)=>{const image=new Image();image.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg.replaceAll('#5A2AFF',ink))));await image.decode();return image;};
document.querySelector('#build').onclick=async()=>{
 const button=document.querySelector('#build');button.disabled=true;save.disabled=true;outputs.clear();links.replaceChildren();
 try{
  const {parts,total}=timeline(),frames=Math.ceil(total/1000*FPS),outlines=await(await fetch('./prefixes.json')).json();
  const canvas=document.createElement('canvas');canvas.width=W*S;canvas.height=H*S;const ctx=canvas.getContext('2d',{willReadFrequently:true}),agent=document.createElement('canvas');
  for(const dark of[false,true]){
   clearTimelineCache();const stem='wordmark-'+(dark?'dark':'light'),background=dark?'#0d1117':'#ffffff',ink=dark?'#f4f4f0':'#242424',violet=dark?'#b29aff':'#5a2aff';
   const images=await Promise.all(outlines.map(async word=>Promise.all(word.prefixes.map(prefix=>imageFrom(prefix.svg,ink))))),encoder=GIFEncoder();
   for(let frame=0;frame<frames;frame++){
    const time=Math.min(total-1,frame*1000/FPS),part=parts.find(p=>time>=p.start&&time<p.start+p.duration),local=time-part.start;
    const count=part.phase==='type'?Math.min(words[part.index].length,Math.floor(local/65)+1):part.phase==='hold'?words[part.index].length:part.phase==='erase'?Math.max(0,words[part.index].length-Math.floor(local/30)-1):0;
    const motion=motionAt(time,parts,total);
    await paintTimeline(agent,{steps:[{state:motion.state,durationMs:10000}],timeMs:motion.local,poseBridge:motion.bridge,size:160,color:violet,background:'transparent',showLabel:false,reducedMotion:false,getSVG});
    ctx.fillStyle=background;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(agent,128*S,46*S,80*S,80*S);
    // Each prefix is a complete shaped outline, never a cropped Arabic glyph.
    // Visible ink stays beside the agent as the RTL word grows and clears.
    const x=224*S,y=56*S,prefix=outlines[part.index].prefixes[count-1];
    if(prefix)ctx.drawImage(images[part.index][count-1],x,y,prefix.width*S,64*S);
    if(part.phase==='type'){const cursor=part.index===0?x+(prefix?.width||0)*S+4*S:x-6*S;ctx.fillStyle=violet;ctx.fillRect(cursor,68*S,2*S,40*S);}
    preview.getContext('2d').drawImage(canvas,0,0,W,H);
    const rgba=preview.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data,palette=quantize(rgba,256),indexed=applyPalette(rgba,palette);
    const delay=Math.round((frame+1)*1000/FPS/10)*10-Math.round(frame*1000/FPS/10)*10;
    encoder.writeFrame(indexed,W,H,{palette,delay,repeat:0});
    status.textContent=(dark?'Dark':'Light')+' '+(frame+1)+' / '+frames;
    if(frame===Math.floor(words[0].length*65/1000*FPS)+2){const blob=await new Promise(resolve=>preview.toBlob(resolve,'image/png'));dataLink(new Uint8Array(await blob.arrayBuffer()),stem+'.png','image/png');}
    if(frame%8===0)await new Promise(resolve=>setTimeout(resolve,0));
   }
   encoder.finish();dataLink(Uint8Array.from(encoder.bytes()),stem+'.gif','image/gif');
  }
  status.textContent='Finished: smooth native Coding / Speaking transitions; solid text; 24 fps; '+(total/1000).toFixed(2)+' seconds.';save.disabled=false;
 }catch(error){status.textContent='Export failed: '+error.message;}finally{button.disabled=false;}
};
</script></html>
