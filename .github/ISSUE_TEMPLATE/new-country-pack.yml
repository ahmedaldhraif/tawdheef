name: New directory pack
description: Propose a researched country or industry directory
title: "[Pack] "
body:
  - type: markdown
    attributes:
      value: "Any country or industry is welcome. A small, well-sourced pack is useful. An issue proposes work; it does not mean a pack is already available."
  - type: input
    id: scope
    attributes:
      label: Country and scope
      placeholder: "Country name; all sectors or a specific industry"
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: What have you researched?
      description: Describe the coverage, the snapshot date and known gaps. Give a count only if you have actual records. Say whether you are proposing research or sharing a prepared CSV.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and sample entries
      description: Add public evidence links and a few real organisation names. Distinguish employers, agencies, portals and programmes. No inferred contacts or eligibility.
    validations:
      required: true
  - type: input
    id: checked-date
    attributes:
      label: Source check date or research period
      placeholder: "YYYY-MM-DD or a dated research period"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Sources, reuse terms and prepared files
      description: Note where the data came from, reuse terms and required attribution; say unknown if not established. Public access alone is not permission to redistribute. If available, link a CSV or PR with pack.json and public source.json. No tracking exports or account data.
    validations:
      required: true
  - type: checkboxes
    id: public-data
    attributes:
      label: Public data only
      options:
        - label: The proposed pack contains public directory information and source evidence, not private applicant or account data.
          required: true
