name: Verify desktop downloads

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run release:app -- --output outputs/desktop
      - name: Verify exact archive through its launcher
        run: npm run release:app:smoke -- --directory outputs/desktop --output outputs/desktop/smoke-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            outputs/desktop/*.zip
            outputs/desktop/package-report.json
            outputs/desktop/SHA256SUMS.txt
            outputs/desktop/smoke-verification.json
          if-no-files-found: error
