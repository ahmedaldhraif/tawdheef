name: Check contributions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contributions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/marketing/build-directory-pack.mjs --check
      - run: npm run release:check
      - run: npm run build
      - run: node website/build.mjs
      - run: node scripts/marketing/check-seo.mjs
